
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MELBA Technical Department</title>

<style>
* {
    box-sizing: border-box;
}

body {
    background-image: url('https://th.bing.com/th/id/R.d87217d7ce2bd7b22f035551b9776d6c?rik=E6dE0qyzfKSe9g&pid=ImgRaw&r=0');
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
    background-attachment: fixed;
    margin: 0;
    padding: 15px;
    min-height: 100vh;
    font-family: Arial, sans-serif;
}

/* Back link */
.back-link {
    display: inline-block;
    color: white;
    background: #003366;
    padding: 10px 20px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    margin-bottom: 15px;
}

.back-link:hover {
    background: #007bff;
}

/* Main container */
.container {
    background: rgba(220, 225, 225, 0.94);
    position: relative;
    width: 347px;
    height: 350px;
    max-width: 100%;
    border: 4px solid blue;
    border-radius: 20px;
    margin: 0 auto 25px;
}

/* Original buttons */
.container button {
    position: absolute;
    height: 100px;
    width: 100px;
    border-radius: 50%;
    border: 3px solid white;
    color: white;
    font-size: 12px;
    font-weight: bold;
    padding: 5px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    transition: 0.3s ease;
    animation: blink-animation 3s infinite;
}

.container button:hover {
    transform: scale(1.08);
    animation: none;
    color: white;
}

#button1 {
    margin-left: 100px;
    margin-top: 10px;
    background: #008cba;
}

#button2 {
    margin-left: 10px;
    margin-top: 50px;
    background: #565d15;
}

#button3 {
    margin-left: 5px;
    margin-top: 148px;
    background: #9fa52a;
}

#button4 {
    margin-left: 73px;
    margin-top: 220px;
    background: #2c2aa5;
}

#button5 {
    margin-left: 195px;
    margin-top: 30px;
    background: #33a3a9;
}

#button6 {
    margin-left: 225px;
    margin-top: 125px;
    background: #6b2020;
}

#button7 {
    margin-left: 170px;
    margin-top: 206px;
    background: #2aa549;
}

/* Annual plan center button */
#buttonc {
    position: absolute;
    height: 70px !important;
    width: 70px !important;
    margin-left: 125px;
    margin-top: 130px;
    border-radius: 50%;
    background: linear-gradient(135deg, #006400, #32cd32);
    font-size: 11px;
    z-index: 2;
}

/* Original button blinking animation */
@keyframes blink-animation {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.82; }
}

/* New circular buttons section */
.extra-buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 35px;
    max-width: 800px;
    margin: 25px auto;
    padding: 20px;
}

/* Remove link underline */
.extra-buttons a {
    text-decoration: none;
}

/* Attractive circle buttons */
.circle-button {
    width: 155px;
    height: 155px;
    border: 4px solid white;
    border-radius: 50%;
    color: white;
    font-size: 14px;
    font-weight: bold;
    text-align: center;
    cursor: pointer;
    padding: 12px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;

    box-shadow: 0 8px 18px rgba(0,0,0,0.4);
    transition: transform 0.35s ease, box-shadow 0.35s ease;
    animation: circlePulse 2.5s infinite;
}

/* Inspection Assigned Persons */
#buttonInspection {
    background: linear-gradient(135deg, #005bea, #00c6fb);
}

/* Weekly Maintenance Form */
#buttonWeekly {
    background: linear-gradient(135deg, #11998e, #38ef7d);
}

.circle-button:hover {
    transform: scale(1.12) rotate(3deg);
    box-shadow: 0 12px 28px rgba(0,0,0,0.5);
    border-color: #ffe082;
    animation: none;
}

.circle-icon {
    font-size: 30px;
    line-height: 1;
}

@keyframes circlePulse {
    0%, 100% {
        box-shadow: 0 8px 18px rgba(0,0,0,0.3);
    }
    50% {
        box-shadow: 0 8px 25px rgba(0,150,255,0.55);
    }
}

/* Responsive display for phones */
@media (max-width: 420px) {
    body {
        padding: 10px;
        background-attachment: scroll;
    }

    .container {
        transform: scale(0.95);
        transform-origin: top center;
        margin-bottom: 5px;
    }

    .extra-buttons {
        gap: 18px;
        padding: 10px 0;
    }

    .circle-button {
        width: 135px;
        height: 135px;
        font-size: 12px;
        padding: 9px;
    }

    .circle-icon {
        font-size: 25px;
    }
}

</style>
</head>

</body>
</html>
